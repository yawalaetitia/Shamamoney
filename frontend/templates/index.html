<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💰 Dashboard Mobile Money</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <h1>💰 Dashboard Mobile Money</h1>

    <div id="login-section">
      <input id="username" placeholder="Nom d'utilisateur" autocomplete="username" />
      <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" />
      <button onclick="login()">Se connecter</button>
      <p id="login-error"></p>
    </div>

    <div id="dashboard" class="hidden">
      <div class="tabs">
        <button id="tab-transactions" class="active" onclick="showTab('transactions')">Transactions</button>
        <button id="tab-new" onclick="showTab('new-transaction')">Nouvelle Transaction</button>
      </div>

      <div id="transactions-tab">
        <ul id="transaction-list">
          <!-- Transactions s'affichent ici -->
        </ul>
      </div>

      <div id="new-transaction-tab" class="hidden">
        <label for="amount">Montant</label>
        <input type="number" id="amount" min="0" placeholder="Ex: 1000" />

        <label for="phone_number">Numéro de téléphone</label>
        <input type="text" id="phone_number" placeholder="Ex: 0791234567" />

        <label for="transaction_type_select">Type de transaction</label>
        <select id="transaction_type_select"></select>

        <label for="operator_select">Opérateur</label>
        <select id="operator_select"></select>

        <label for="user_select">Utilisateur</label>
        <select id="user_select"></select>

        <button onclick="createTransaction()">Valider</button>
        <p id="creation-message"></p>
      </div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
